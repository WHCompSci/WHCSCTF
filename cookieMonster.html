<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Monster</title>

    <style>
        body {
            background-color: #111;
            color: #f4f4f4;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }

        .container {
            width: 500px;
            margin: auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,255,0,0.2);
        }

        h1 {
            color: #00ff88;
        }

        .flag {
            margin-top: 20px;
            color: yellow;
            font-size: 20px;
            font-weight: bold;
        }

        .hint {
            margin-top: 15px;
            color: #999;
            font-style: italic;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Cookie Monster</h1>
    <div id="content"></div>
</div>

<script>
    // =========================
    // COOKIE FUNCTIONS
    // =========================

    function getCookie(name) {
        let cookies = document.cookie.split(";");

        for (let cookie of cookies) {
            let [key, value] = cookie.trim().split("=");

            if (key === name) {
                return value;
            }
        }

        return null;
    }

    function setCookie(name, value) {
        document.cookie = `${name}=${value}; path=/`;
    }

    // =========================
    // MAIN CHALLENGE LOGIC
    // =========================

    async function loadFlag() {

        const content = document.getElementById("content");

        try {

            // Check cookie
            let role = getCookie("role");

            // If no cookie exists, create default user
            if (!role) {
                setCookie("role", "user");
                role = "user";
            }

            // =========================
            // USER VIEW
            // =========================

            if (role !== "admin") {

                content.innerHTML = `
                    <p>You are logged in as a normal user.</p>
                    <p>Admins get special access.</p>

                    <div class="hint">
                        Hint: Cookies can be edited...
                    </div>

                    <!-- Definitely secure authentication system -->
                `;

                return;
            }

            // =========================
            // ADMIN API HANDSHAKE
            // =========================

            let token = sessionStorage.getItem('whcs_token');

            // Get session token if missing
            if (!token) {

                const sessionRes = await fetch(
                    'https://whcsctf-api-bdu8.onrender.com/api/session'
                );

                if (sessionRes.ok) {

                    const sessionData = await sessionRes.json();

                    token = sessionData.token;

                    sessionStorage.setItem('whcs_token', token);

                } else {

                    content.innerHTML = `
                        <h2>Admin Access Failed</h2>
                        <p>Security handshake failed.</p>
                    `;

                    return;
                }
            }

            // =========================
            // FETCH FLAG
            // =========================

            const response = await fetch(
                'https://whcsctf-api-bdu8.onrender.com/api/Cookie',
                {
                    method: 'GET',
                    headers: {
                        'x-ctf-token': token
                    }
                }
            );

            const data = await response.json();

            // =========================
            // DISPLAY FLAG
            // =========================

            if (data.error) {

                content.innerHTML = `
                    <h2>Admin Access Failed</h2>
                    <p>${data.error}</p>
                `;

            } else if (data.flag) {

                content.innerHTML = `
                    <h2>Welcome Admin</h2>

                    <div class="flag">
                        Flag: ${data.flag}
                    </div>
                `;

            } else {

                content.innerHTML = `
                    <h2>Welcome Admin</h2>
                    <p>No flag returned.</p>
                `;
            }

        } catch (err) {

            console.error(err);

            content.innerHTML = `
                <h2>Connection Error</h2>
                <p>Could not connect to API.</p>
            `;
        }
    }

    // Start challenge
    loadFlag();

</script>

</body>
</html>
